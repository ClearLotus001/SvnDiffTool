name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-win-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Workbook regression tests
        run: npm run test:workbook

      - name: Rust format check
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Rust clippy
        run: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings

      - name: Build app bundle
        run: npm run build

      - name: Build and publish Windows installer/update assets
        run: npx tsx scripts/build-win-installer.ts --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package size report
        run: npm run report:package-sizes -- --ci
