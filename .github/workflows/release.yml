name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check tag matches package version
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          $actualTag = "${{ github.ref_name }}"
          if ($actualTag -ne $expectedTag) {
            throw "Release tag $actualTag does not match package.json version $expectedTag."
          }
          Write-Host "Release tag $actualTag matches package.json version $($package.version)."

  static-checks:
    name: Static checks
    runs-on: windows-latest
    timeout-minutes: 20
    needs:
      - validate-release-tag
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint and typecheck
        run: npm run verify:static

  workbook-unit-tests:
    name: Workbook unit tests
    runs-on: windows-latest
    timeout-minutes: 25
    needs:
      - validate-release-tag
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run non-Rust workbook tests
        run: npm run test:workbook:unit

  rust-integration-tests:
    name: Rust integration tests
    runs-on: windows-latest
    timeout-minutes: 35
    needs:
      - validate-release-tag
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install dependencies
        run: npm ci

      - name: Build and lint Rust parser
        run: npm run verify:rust

      - name: Run Rust-backed workbook tests
        run: npm run test:workbook:rust

  app-build:
    name: App build
    runs-on: windows-latest
    timeout-minutes: 20
    needs:
      - validate-release-tag
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app bundle
        run: npm run build:app

  build-and-publish-win-release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    needs:
      - static-checks
      - workbook-unit-tests
      - rust-integration-tests
      - app-build
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install dependencies
        run: npm ci

      - name: Build Rust parser
        run: npm run build:rust

      - name: Build app bundle
        run: npm run build:app

      - name: Build and publish Windows installer/update assets
        run: npx tsx scripts/build-win-installer.ts --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package size report
        run: npm run report:package-sizes -- --ci
